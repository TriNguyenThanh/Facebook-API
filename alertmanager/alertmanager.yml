global:
  resolve_timeout: 5m
  smtp_smarthost: "__SMTP_SMARTHOST__"
  smtp_from: "__SMTP_FROM__"
  smtp_auth_username: "__SMTP_USERNAME__"
  smtp_auth_password: "__SMTP_PASSWORD__"
  smtp_require_tls: true

route:
  receiver: ops-email
  group_wait: 0s
  group_interval: 1m
  repeat_interval: 30m
  routes:
    - receiver: ops-email
      matchers:
        - severity="critical"
      group_wait: 0s

receivers:
  - name: ops-email
    email_configs:
      - to: "__EMAIL_TO__"
        send_resolved: true
        headers:
          subject: '[critical] {{ .CommonLabels.alertname }}'
