name: CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/ci.yml"
      - "core_service/**"
      - "retry_service/**"
      - "ucode_page_api/**"
      - "ucode_webhook/**"
      - "requirements.txt"
      - "docker-compose*.yml"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "core_service/**"
      - "retry_service/**"
      - "ucode_page_api/**"
      - "ucode_webhook/**"
      - "requirements.txt"
      - "docker-compose*.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  DJANGO_DEBUG: "0"
  DJANGO_SECRET_KEY: ci-only-secret-key
  DJANGO_DB_ENGINE: django.db.backends.sqlite3
  DJANGO_DB_NAME: ":memory:"
  KAFKA_BOOTSTRAP_SERVERS: localhost:9092
  KAFKA_RAW_EVENTS_TOPIC: raw_events
  KAFKA_REPLY_COMMANDS_TOPIC: reply_commands
  KAFKA_SEND_FAILED_TOPIC: send_failed
  KAFKA_SEND_RETRY_TOPIC: send_retry
  KAFKA_DEAD_LETTER_TOPIC: dead_letter
  FACEBOOK_ACTIONS_ENABLED: "0"
  FACEBOOK_APP_SECRET: ci-app-secret
  FACEBOOK_VERIFY_TOKEN: ci-verify-token
  FACEBOOK_PAGE_ACCESS_TOKEN: ci-page-access-token
  PAGE_ID: ci-page-id
  ADMIN_API_KEY: ci-admin-api-key
  DIFY_API_KEY: ""

jobs:
  service-tests:
    name: ${{ matrix.service.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: backend-api
            directory: ucode_page_api
            requirements: ucode_page_api/requirements.txt
            settings: core.settings
          - name: webhook-service
            directory: ucode_webhook
            requirements: requirements.txt
            settings: core.settings
          - name: core-service
            directory: core_service
            requirements: core_service/requirements.txt
            settings: core_service.settings
          - name: retry-service
            directory: retry_service
            requirements: requirements.txt
            settings: retry_service.settings

    defaults:
      run:
        shell: bash

    env:
      DJANGO_SETTINGS_MODULE: ${{ matrix.service.settings }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ matrix.service.requirements }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "${{ matrix.service.requirements }}"

      - name: Run Django system checks
        working-directory: ${{ matrix.service.directory }}
        run: python manage.py check

      - name: Check migrations
        working-directory: ${{ matrix.service.directory }}
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        working-directory: ${{ matrix.service.directory }}
        run: python manage.py test --verbosity 2

  compose-config:
    name: docker-compose config
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          if [ -f docker-compose.dev.yml ]; then
            docker compose -f docker-compose.dev.yml config --quiet
          fi
